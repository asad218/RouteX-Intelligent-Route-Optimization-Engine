version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: routex-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: routex_db
      MYSQL_USER: routex_user
      MYSQL_PASSWORD: routexpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routex-backend
    restart: always
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: routex_user
      DB_PASSWORD: routexpassword
      DB_NAME: routex_db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: routex-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
